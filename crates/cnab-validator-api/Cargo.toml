[package]
name = "cnab-validator-api"
version = "0.1.0"
description = "API HTTP de validação de arquivo CNAB, dirigida pelos specs do validador oficial do Bradesco"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cnab-core = { path = "../cnab-core" }
cnab-specs = { path = "../cnab-specs" }
serde.workspace = true
serde_json.workspace = true
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower-http = { version = "0.6", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
